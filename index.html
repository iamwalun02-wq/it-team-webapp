<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="侯中IT" />
  <title>侯中 IT Team</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>侯中 IT Team</h1>
      <div class="meta" id="updatedAt">載入中…</div>
      <div id="displayBanner" class="display-banner" hidden></div>
      <div id="exampleBadge" class="badge-example" hidden>示範資料（非即時）</div>
    </header>

    <div id="errorBanner" class="error-banner" role="alert"></div>

    <section class="section" aria-labelledby="eq-title">
      <div class="section-header">
        <div class="section-titles">
          <h2 id="eq-title">今日課室器材借用</h2>
          <p id="eqSubtitle" class="section-subtitle" hidden></p>
        </div>
        <span class="count" id="eqCount">0</span>
      </div>
      <div id="equipmentBody">
        <div class="empty">載入中…</div>
      </div>
    </section>

    <section class="section" aria-labelledby="venue-title">
      <div class="section-header">
        <div class="section-titles">
          <h2 id="venue-title">今日場地借用</h2>
          <p id="venueSubtitle" class="section-subtitle" hidden></p>
        </div>
        <span class="count" id="venueCount">0</span>
      </div>
      <div id="venuesBody">
        <div class="empty">載入中…</div>
      </div>
    </section>

    <section class="section" aria-labelledby="maint-title">
      <div class="section-header">
        <div class="section-titles">
          <h2 id="maint-title">未完成維修（跟進中）</h2>
        </div>
        <span class="count" id="maintCount">0</span>
      </div>
      <div id="maintenanceBody">
        <div class="empty">載入中…</div>
      </div>
    </section>

    <footer class="footer">
      青松侯寶垣中學 · IT Team 助手 · 本地靜態頁
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
